<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 200" role="img" aria-labelledby="t d">
  <title id="t">A scalar Kalman filter smoothing a noisy measurement</title>
  <desc id="d">A predict and update cycle runs on the left; on the scope the noisy measurement scatters while the filter estimate follows the true value.</desc>
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d2238"/>
      <stop offset="1" stop-color="#102f34"/>
    </linearGradient>
    <filter id="g2" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="3.4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      .lbl  { font-family: ui-monospace, monospace; font-size: 12px; fill: #9edbc4; letter-spacing: 1px; }
      .blk  { font-family: ui-monospace, monospace; font-size: 14px; fill: #e8f5ef; letter-spacing: 1.5px; }
      .sml  { font-family: ui-monospace, monospace; font-size: 11px; fill: #e8f5ef; letter-spacing: 1px; }
      .wire { stroke: #51c99c; stroke-width: 2.2; fill: none; opacity: .75; }
      .box  { fill: none; stroke: #70e1b2; stroke-width: 2; opacity: .85; }
      .grid { stroke: #234a52; stroke-width: 1; opacity: .55; }
      .noisy { fill: none; stroke: #5f8fb0; stroke-width: 1.2; opacity: .45; }
      .truth { fill: none; stroke: #f2bd68; stroke-width: 2; stroke-dasharray: 7 7; opacity: .8; }
      .drift { fill: none; stroke: #d97a6c; stroke-width: 2; opacity: .7; }
      .est  { fill: none; stroke: #70e1b2; stroke-width: 3;
               stroke-dasharray: 1000; stroke-dashoffset: 1000;
               animation: draw 6s linear infinite; }
      .band { fill: #70e1b2; opacity: .13; }
      .pcl  { fill: none; stroke: #70e1b2; stroke-width: 1; opacity: .22; }
      @keyframes draw { 0% { stroke-dashoffset: 1000; } 72% { stroke-dashoffset: 0; } 100% { stroke-dashoffset: 0; } }
      @media (prefers-reduced-motion: reduce) {
        .est { animation: none; stroke-dashoffset: 0; }
      }
    </style>
  </defs>

  <rect width="1200" height="200" rx="24" fill="url(#bg2)"/>

